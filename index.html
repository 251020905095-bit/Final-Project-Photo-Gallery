<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Final Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="grid-container">
        <figure>
            <img src="images/blooming_trees.png" alt="Cây đang nở hoa rực rỡ vào mùa xuân">
            <figcaption>Nội dung hình ảnh số một mô tả cảnh thiên nhiên tươi đẹp.</figcaption>
        </figure>

        <figure>
            <img src="images/tulips.png" alt="Vườn hoa tulip nhiều màu sắc dưới ánh nắng">
            <figcaption>Nội dung hình ảnh số hai mô tả các đóa hoa tulip rực rỡ.</figcaption>
        </figure>

        <figure>
            <img src="images/bacon_in_the_woods.png" alt="Khung cảnh thiên nhiên trong lành trong rừng sâu">
            <figcaption>Nội dung hình ảnh số ba mô tả phong cảnh rừng cây xanh mát.</figcaption>
        </figure>
    </main>

</body>
</html>
